# RAVEN monitoring stack — Prometheus + Grafana.
#
# Run from the repo root:
#
#     docker compose -f monitoring/docker-compose.yml up -d
#
# Then open http://localhost:3000 (Grafana, default creds
# admin / admin — change on first login) and the
# `RAVEN / RAVEN — overview` dashboard will be there.
#
# Volumes:
#   * The repo's `workspace/eval/` is mounted read-only into both
#     Prometheus (so the textfile collector can read
#     `*.prom`) and Grafana (so the dashboard JSON is accessible).
#   * `prometheus-data` and `grafana-data` are persisted volumes
#     so the dashboards / alert state survive a container restart.
#
# If your RAVEN web server runs on the host (not in Docker), the
# `raven-app` scrape target of `host.docker.internal:8080` is
# correct on Docker Desktop / OrbStack.  On plain Linux Docker
# use `network_mode: host` or add `--add-host=host.docker.internal:host-gateway`.

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: raven-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The textfile collector needs read access to the eval dir.
      # Adjust this path if your checkout isn't at /home/raven/RAVEN.
      - ${RAVEN_WORKSPACE:-../workspace}:/workspace:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - raven-monitoring

  grafana:
    image: grafana/grafana:11.3.0
    container_name: raven-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - raven-monitoring

networks:
  raven-monitoring:
    driver: bridge

volumes:
  grafana-data:
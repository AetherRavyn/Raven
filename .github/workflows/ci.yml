name: ci

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop, "feat/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RAVEN_HELIX_URL: http://localhost:8080
  RAVEN_LOG_JSON: "true"
  RAVEN_LOG_LEVEL: INFO
  RAVEN_OTEL_IN_MEMORY: "true"

jobs:
  # ── 1. Lint + format ──────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Set up venv
        run: uv venv
      - name: Install package
        run: uv pip install -e ".[dev]"
      - name: Ruff check (full app/)
        run: .venv/bin/ruff check app/
      - name: Ruff format check (full app/)
        run: .venv/bin/ruff format --check app/

  # ── 2. Type check ─────────────────────────────────────────────
  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Set up venv
        run: uv venv
      - name: Install package
        run: uv pip install -e ".[dev]"
      - name: Pyright (full app/)
        run: .venv/bin/pyright app/

  # ── 3. Security scan ──────────────────────────────────────────
  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Set up venv
        run: uv venv
      - name: Install package + bandit
        run: |
          uv pip install -e ".[dev]"
          uv pip install bandit[toml]
      - name: Bandit scan (new modules)
        run: >
          .venv/bin/bandit -r
          app/core/prediction
          app/core/governance
          app/core/edge
          app/core/skill_enhancement
          app/core/unified_multimodal.py
          app/core/unified_multimodal_integration.py
          app/core/multimodal_connectors.py
          app/companion
          -lll
          --skip B101,B311
        continue-on-error: false
      - name: Bandit scan (full app/, advisory)
        run: >
          .venv/bin/bandit -r app/
          -lll
          --skip B101,B311
          -f json -o bandit-report.json
        continue-on-error: true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── 4. Tests + coverage ───────────────────────────────────────
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    services:
      helix:
        image: ghcr.io/helixdb/enterprise-dev:latest
        ports:
          - 6969:6969
          - 8080:8080
        options: >-
          --health-cmd "curl -fsS http://localhost:8080/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Set up venv
        run: uv venv
      - name: Install package
        run: uv pip install -e ".[dev]"
      - name: Wait for HelixDB
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then
              echo "HelixDB ready"
              break
            fi
            sleep 2
          done
      - name: Helix client smoke
        run: .venv/bin/pytest tests/test_helix.py -v --tb=short
      - name: Full test suite
        run: |
          .venv/bin/pytest -v --tb=short \
            --deselect tests/test_dm_pairing.py::TestOrchestratorAndGatewayIntegration \
            --deselect tests/test_phase_integration.py::TestSkillAutoInvocation \
            --deselect tests/test_vault.py::TestEncryption::test_no_plaintext_on_disk \
            --deselect tests/test_vault.py::TestRotation::test_rotate_creates_new_key_file
      - name: Coverage report
        run: |
          .venv/bin/pytest --cov=app/ \
            --cov-report=xml --cov-report=term-missing --no-header -q
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 5. Build sanity ───────────────────────────────────────────
  build:
    name: Build (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install build tooling
        run: pip install --upgrade build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

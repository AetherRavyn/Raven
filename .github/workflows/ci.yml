name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install uv
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - name: Ruff check
        run: .venv/bin/ruff check app/db app/core/planning tests
      - name: Ruff format check
        run: .venv/bin/ruff format --check app/db app/core/planning tests
      - name: Pyright
        run: .venv/bin/pyright app/db app/core/planning tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      helix:
        image: ghcr.io/helixdb/enterprise-dev:latest
        ports:
          - 6969:6969
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install uv
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - name: Wait for HelixDB
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:8080/health; then break; fi
            sleep 2
          done
      - name: Helix client tests
        env:
          SARAS_HELIX_URL: http://localhost:8080
        run: .venv/bin/pytest tests/test_helix.py -v
      - name: Planning tests
        run: .venv/bin/pytest tests/test_planning.py -v
      - name: Full test suite
        env:
          SARAS_HELIX_URL: http://localhost:8080
        run: .venv/bin/pytest -v --tb=short -x

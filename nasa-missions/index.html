<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Space Missions Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 160px 120px, #fff, transparent);
            background-size: 200px 200px;
            animation: twinkle 4s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        header {
            text-align: center;
            padding: 60px 20px 40px;
            background: linear-gradient(180deg, rgba(0,50,150,0.3) 0%, transparent 100%);
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d92);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 50px rgba(0,212,255,0.5);
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #8aaaff;
            letter-spacing: 3px;
        }
        
        .api-key-input {
            margin: 20px auto;
            max-width: 400px;
        }
        
        .api-key-input input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #00d4ff;
            border-radius: 30px;
            background: rgba(0,20,50,0.8);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        
        .api-key-input input:focus {
            box-shadow: 0 0 30px rgba(0,212,255,0.4);
            border-color: #7b2ff7;
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 20px;
            margin-top: 20px;
        }
        
        .nav button {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,47,247,0.2));
            color: #00d4ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(0,212,255,0.3);
        }
        
        .nav button:hover, .nav button.active {
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.4);
        }
        
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .section {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .section.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card {
            background: linear-gradient(135deg, rgba(20,30,60,0.9), rgba(10,20,40,0.9));
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(0,212,255,0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .apod-container {
            text-align: center;
        }
        
        .apod-image {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,212,255,0.3);
            margin: 20px 0;
        }
        
        .apod-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #00d4ff;
            margin-bottom: 15px;
        }
        
        .apod-date {
            color: #8aaaff;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        
        .apod-explanation {
            text-align: justify;
            line-height: 1.8;
            color: #c0c0e0;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .photo-card {
            background: linear-gradient(135deg, rgba(20,30,60,0.8), rgba(10,20,40,0.8));
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(123,47,247,0.3);
            transition: all 0.3s;
        }
        
        .photo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,212,255,0.3);
            border-color: #00d4ff;
        }
        
        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .photo-info {
            padding: 20px;
        }
        
        .photo-info h3 {
            font-family: 'Orbitron', sans-serif;
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .photo-info p {
            color: #8aaaff;
            font-size: 0.9rem;
        }
        
        .asteroid-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .asteroid-table th, .asteroid-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(0,212,255,0.2);
        }
        
        .asteroid-table th {
            font-family: 'Orbitron', sans-serif;
            color: #00d4ff;
            background: rgba(0,50,100,0.3);
        }
        
        .asteroid-table tr:hover {
            background: rgba(0,100,200,0.1);
        }
        
        .hazardous {
            color: #ff4444;
            font-weight: bold;
        }
        
        .safe {
            color: #44ff44;
        }
        
        .epic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .epic-card {
            background: rgba(20,30,60,0.8);
            border-radius: 15px;
            overflow: hidden;
        }
        
        .epic-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        
        .epic-info {
            padding: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #00d4ff;
            font-family: 'Orbitron', sans-serif;
        }
        
        .error {
            text-align: center;
            padding: 30px;
            background: rgba(255,50,50,0.2);
            border-radius: 15px;
            color: #ff6666;
            margin: 20px 0;
        }
        
        footer {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 0.9rem;
        }
        
        footer a {
            color: #00d4ff;
            text-decoration: none;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .nav button { padding: 10px 20px; font-size: 0.8rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <header>
        <h1>🚀 NASA SPACE MISSIONS</h1>
        <p class="subtitle">EXPLORE THE COSMOS THROUGH DATA</p>
        
        <div class="api-key-input">
            <input type="text" id="apiKey" placeholder="Enter NASA API Key (or use DEMO_KEY)" value="DEMO_KEY">
        </div>
    </header>
    
    <nav class="nav">
        <button class="active" data-section="apod">Astronomy Picture of Day</button>
        <button data-section="mars">Mars Rovers</button>
        <button data-section="asteroids">Near Earth Asteroids</button>
        <button data-section="epic">Earth Images</button>
    </nav>
    
    <main>
        <section id="apod" class="section active">
            <div class="card">
                <div class="apod-container" id="apodContent">
                    <div class="loading">Loading Astronomy Picture of the Day...</div>
                </div>
            </div>
        </section>
        
        <section id="mars" class="section">
            <div class="card">
                <div style="margin-bottom: 20px;">
                    <select id="roverSelect" style="padding: 12px 25px; border-radius: 25px; background: rgba(0,50,100,0.8); color: #fff; border: 1px solid #00d4ff; font-size: 1rem; cursor: pointer;">
                        <option value="curiosity">Curiosity</option>
                        <option value="opportunity">Opportunity</option>
                        <option value="spirit">Spirit</option>
                    </select>
                    <button id="loadMars" style="padding: 12px 30px; border-radius: 25px; background: linear-gradient(135deg, #00d4ff, #7b2ff7); color: #fff; border: none; font-size: 1rem; cursor: pointer; margin-left: 15px;">Load Photos</button>
                </div>
                <div class="grid" id="marsContent">
                    <div class="loading">Select a rover and click Load Photos</div>
                </div>
            </div>
        </section>
        
        <section id="asteroids" class="section">
            <div class="card">
                <div style="margin-bottom: 20px;">
                    <button id="loadAsteroids" style="padding: 12px 30px; border-radius: 25px; background: linear-gradient(135deg, #00d4ff, #7b2ff7); color: #fff; border: none; font-size: 1rem; cursor: pointer;">Load Near Earth Asteroids</button>
                </div>
                <div id="asteroidsContent">
                    <div class="loading">Click to load asteroid data</div>
                </div>
            </div>
        </section>
        
        <section id="epic" class="section">
            <div class="card">
                <div id="epicContent">
                    <div class="loading">Loading Earth imagery...</div>
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <p>Data provided by <a href="https://api.nasa.gov" target="_blank">NASA Open APIs</a></p>
    </footer>
    
    <script>
        const apiKeyInput = document.getElementById('apiKey');
        let apiKey = apiKeyInput.value;
        
        apiKeyInput.addEventListener('change', () => {
            apiKey = apiKeyInput.value || 'DEMO_KEY';
            loadAPOD();
            loadEPIC();
        });
        
        document.querySelectorAll('.nav button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.section).classList.add('active');
            });
        });
        
        async function loadAPOD() {
            const container = document.getElementById('apodContent');
            try {
                container.innerHTML = '<div class="loading">Loading...</div>';
                const response = await fetch(`https://api.nasa.gov/planetary/apod?api_key=${apiKey}`);
                const data = await response.json();
                
                if (data.code) {
                    container.innerHTML = `<div class="error">Error: ${data.msg || data.error.message}</div>`;
                    return;
                }
                
                const isVideo = data.media_type === 'video';
                container.innerHTML = `
                    <h2 class="apod-title">${data.title}</h2>
                    <p class="apod-date">${data.date}</p>
                    ${isVideo ? 
                        `<iframe src="${data.url}" width="100%" height="500" frameborder="0" allowfullscreen style="border-radius: 15px;"></iframe>` :
                        `<img src="${data.hdurl || data.url}" alt="${data.title}" class="apod-image">`
                    }
                    <p class="apod-explanation">${data.explanation}</p>
                    <p style="margin-top: 20px; color: #666;">Copyright: ${data.copyright || 'Public Domain'}</p>
                `;
            } catch (error) {
                container.innerHTML = `<div class="error">Failed to load: ${error.message}</div>`;
            }
        }
        
        document.getElementById('loadMars').addEventListener('click', async () => {
            const container = document.getElementById('marsContent');
            const rover = document.getElementById('roverSelect').value;
            container.innerHTML = '<div class="loading">Loading Mars photos...</div>';
            
            try {
                const response = await fetch(`https://api.nasa.gov/mars-photos/api/v1/rovers/${rover}/latest_photos?api_key=${apiKey}`);
                const data = await response.json();
                
                if (data.photos && data.photos.length > 0) {
                    const photos = data.photos.slice(0, 24);
                    container.innerHTML = photos.map(photo => `
                        <div class="photo-card">
                            <img src="${photo.img_src}" alt="${photo.id}" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Not+Available'">
                            <div class="photo-info">
                                <h3>${photo.camera.full_name}</h3>
                                <p>Rover: ${photo.rover.name}</p>
                                <p>Earth Date: ${photo.earth_date}</p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="error">No photos available for this rover</div>';
                }
            } catch (error) {
                container.innerHTML = `<div class="error">Failed to load: ${error.message}</div>`;
            }
        });
        
        document.getElementById('loadAsteroids').addEventListener('click', async () => {
            const container = document.getElementById('asteroidsContent');
            const today = new Date().toISOString().split('T')[0];
            container.innerHTML = '<div class="loading">Loading asteroid data...</div>';
            
            try {
                const response = await fetch(`https://api.nasa.gov/neo/rest/v1/feed?start_date=${today}&end_date=${today}&api_key=${apiKey}`);
                const data = await response.json();
                
                if (data.near_earth_objects && data.near_earth_objects[today]) {
                    const asteroids = data.near_earth_objects[today].slice(0, 20);
                    container.innerHTML = `
                        <h3 style="color: #00d4ff; margin-bottom: 15px;">Near Earth Objects for ${today}</h3>
                        <table class="asteroid-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Diameter (m)</th>
                                    <th>Close Approach</th>
                                    <th>Hazarded</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${asteroids.map(a => `
                                    <tr>
                                        <td>${a.name}</td>
                                        <td>${Math.round(a.estimated_diameter.meters.estimated_diameter_max)} m</td>
                                        <td>${a.close_approach_data[0]?.close_approach_date || 'N/A'}</td>
                                        <td class="${a.is_potentially_hazardous_asteroid ? 'hazardous' : 'safe'}">
                                            ${a.is_potentially_hazardous_asteroid ? '⚠ YES' : '✓ Safe'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = '<div class="error">No asteroid data available</div>';
                }
            } catch (error) {
                container.innerHTML = `<div class="error">Failed to load: ${error.message}</div>`;
            }
        });
        
        async function loadEPIC() {
            const container = document.getElementById('epicContent');
            try {
                container.innerHTML = '<div class="loading">Loading Earth images...</div>';
                const response = await fetch(`https://api.nasa.gov/EPIC/api/natural/all?api_key=${apiKey}`);
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    const images = data.slice(0, 12);
                    container.innerHTML = `
                        <h3 style="color: #00d4ff; margin-bottom: 20px;">Recent Earth Images from EPIC</h3>
                        <div class="epic-grid">
                            ${images.map(img => `
                                <div class="epic-card">
                                    <img src="https://epic.gsfc.nasa.gov/epic-archive/png/${img.image}.png" alt="${img.date}" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Not+Available'">
                                    <div class="epic-info">
                                        <p style="color: #00d4ff;">${img.date}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = '<div class="error">No EPIC images available</div>';
                }
            } catch (error) {
                container.innerHTML = `<div class="error">Failed to load: ${error.message}</div>`;
            }
        }
        
        loadAPOD();
        loadEPIC();
    </script>
</body>
</html>

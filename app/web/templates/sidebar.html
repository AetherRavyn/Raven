{% set nav = nav_entries() %}
<aside class="w-56 flex flex-col overflow-y-auto" style="background: var(--bg-secondary); border-right: 1px solid var(--border-color);">
  <div class="px-4 py-3" style="border-bottom: 1px solid var(--border-color);">
    <a href="/" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm" style="background: var(--accent); color: var(--bg-primary);">R</div>
      <div>
        <div class="font-semibold tracking-wider text-sm" style="color: var(--accent);">RAVEN</div>
        <div class="text-[10px] uppercase tracking-widest" style="color: var(--text-muted);">AI Agent Dashboard</div>
      </div>
    </a>
  </div>
  <nav class="flex-1 py-2 text-[12px]">
    <a href="/"
       class="block px-4 py-1.5 transition-colors"
       style="color: var(--text-secondary);"
       onmouseover="this.style.background='var(--bg-hover)'"
       onmouseout="this.style.background='transparent'"
       title="Dashboard home">HOME</a>
    <div class="px-3 mt-2 mb-1 text-[10px] uppercase tracking-widest" style="color: var(--text-muted);">primary</div>
    {% for entry in nav if entry.group == "primary" %}
      <a href="/{{ entry.slug }}"
         class="block px-4 py-1.5 transition-colors"
         style="color: {% if entry.slug == page %}var(--accent){% else %}var(--text-secondary){% endif %}; background: {% if entry.slug == page %}var(--accent-dim){% else %}transparent{% endif %};"
         onmouseover="this.style.background='var(--bg-hover)'"
         onmouseout="this.style.background='{% if entry.slug == page %}var(--accent-dim){% else %}transparent{% endif %}'"
         title="{{ entry.hint }}"
         data-nav-slug="{{ entry.slug }}">{{ entry.label }}</a>
    {% endfor %}
    <div class="px-3 mt-3 mb-1 text-[10px] uppercase tracking-widest" style="color: var(--text-muted);">config</div>
    {% for entry in nav if entry.group == "config" %}
      <a href="/{{ entry.slug }}"
         class="block px-4 py-1.5 transition-colors"
         style="color: {% if entry.slug == page %}var(--accent){% else %}var(--text-secondary){% endif %}; background: {% if entry.slug == page %}var(--accent-dim){% else %}transparent{% endif %};"
         onmouseover="this.style.background='var(--bg-hover)'"
         onmouseout="this.style.background='{% if entry.slug == page %}var(--accent-dim){% else %}transparent{% endif %}'"
         title="{{ entry.hint }}"
         data-nav-slug="{{ entry.slug }}">{{ entry.label }}</a>
    {% endfor %}
  </nav>
  <div class="px-3 py-2" style="border-top: 1px solid var(--border-color);">
    <div class="flex items-center justify-between text-[10px]" style="color: var(--text-muted);">
      <span>v40</span>
      <span id="sidebar-online" class="w-2 h-2 rounded-full" style="background: var(--text-muted);" title="Checking…"></span>
    </div>
  </div>
</aside>

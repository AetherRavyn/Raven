<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Raven — AI Agent Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'Menlo', 'monospace'] },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); }
    .font-mono, code, pre { font-family: 'JetBrains Mono', Menlo, monospace; }
    [x-cloak] { display: none !important; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="antialiased">
  <div id="app-shell" class="flex h-screen w-screen overflow-hidden">
    {% include "sidebar.html" %}
    <main id="raven-main" class="flex-1 flex flex-col overflow-hidden min-w-0">
      <header class="border-b px-3 sm:px-4 py-2 flex items-center gap-2 sm:gap-3" style="border-color: var(--border-color); background: var(--bg-secondary);">
        <button id="mobile-hamburger" onclick="toggleSidebar()" class="md:hidden p-1.5 rounded transition-colors hover:bg-ink-700" style="color: var(--text-secondary);" title="Toggle navigation">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg>
        </button>
        <span class="hidden sm:inline" style="color: var(--text-muted);">Raven</span>
        <span class="hidden sm:inline" style="color: var(--text-muted);">/</span>
        <span class="font-medium truncate min-w-0" style="color: var(--accent);">{{ page_label or page }}</span>
        <span class="flex-1 min-w-0"></span>
        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
          <button id="search-trigger" onclick="if(window.__ravenDashboard) window.__ravenDashboard.focusSearch();" class="text-[11px] px-2 py-1 rounded border transition-colors hidden sm:inline-block" style="border-color:var(--border-color);color:var(--text-muted);background:transparent;" title="Search (/)">&#8984;/</button>
          <button onclick="if(window.__ravenDashboard) window.__ravenDashboard.focusSearch();" class="sm:hidden p-1.5 rounded transition-colors" style="color: var(--text-muted);" title="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <div x-data="{ theme: localStorage.getItem('theme') || 'dark' }" x-init="$watch('theme', val => { localStorage.setItem('theme', val); document.documentElement.setAttribute('data-theme', val); })" class="flex items-center gap-1">
            <button @click="theme = 'dark'" :class="theme === 'dark' ? 'opacity-100' : 'opacity-40'" class="text-sm transition-opacity" title="Dark">&#127769;</button>
            <button @click="theme = 'midnight'" :class="theme === 'midnight' ? 'opacity-100' : 'opacity-40'" class="text-sm transition-opacity hidden sm:inline-block" title="Midnight">&#127771;</button>
            <button @click="theme = 'light'" :class="theme === 'light' ? 'opacity-100' : 'opacity-40'" class="text-sm transition-opacity" title="Light">&#9728;</button>
          </div>
          <span id="status-pill" class="text-[11px] hidden sm:inline" style="color: var(--text-muted);">&mdash;</span>
        </div>
      </header>
      <div id="main" class="flex-1 overflow-auto p-3 sm:p-4 md:p-6 responsive-content" x-data x-on:error="console.error('[Alpine Error]', $event.detail); $event.target.innerHTML = '<div class=\\'error-boundary\\'>Something went wrong. <button onclick=\\'location.reload()\\'>Reload</button></div>';">
        {% block main %}{% endblock %}
      </div>
    </main>
  </div>
  <script src="/static/app.js"></script>
  {% block body_extra %}{% endblock %}
</body>
</html>

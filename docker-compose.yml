version: "3.9"

services:
  helixdb:
    image: ghcr.io/helixdb/enterprise-dev:latest
    container_name: helix-raven
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  raven:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - RAVEN_HELIX_URL=http://localhost:8080
    volumes:
      - ./workspace:/app/workspace
    ports:
      - "8765:8765"
    network_mode: host
    depends_on:
      helixdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

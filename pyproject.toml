[project]
name = "raven"
version = "1.0.0"
description = "Raven — JARVIS-class personal AI agent. Self-improving, multi-platform, autonomous."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "algoliasearch>=4,<5",
    "av>=16.1.0",
    "beautifulsoup4>=4.14.3",
    "cupy-cuda12x>=14.0.1",
    "deepgram-sagemaker>=0.2.0",
    "discord-py>=2.6.4",
    "edge-tts>=7.2.7",
    # v33: Piper-TTS replaces edge-tts for the on-device
    # personality voice (autherRaven).  onnxruntime is already
    # present above.
    "piper-tts>=1.3.0",
    "fastapi>=0.129.0",
    "genai>=2.1.0",
    "google-api-python-client>=2.190.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.4",
    "google-genai>=1.63.0",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "opentelemetry-instrumentation-httpx>=0.40b0",
    "structlog>=24.0.0",
    "prometheus-client>=0.21.0",
    "lap>=0.5.12",
    "loguru>=0.7.3",
    "mcp[cli]>=1.26.0",
    "numpy>=2.4.2",
    "onnxruntime>=1.24.2",
    "opencv-contrib-python>=4.13.0.92",
    "opencv-python-headless>=4.13.0.92",
    "openwakeword>=0.4.0",
    "pandas>=2.0.0",
    "playwright>=1.58.0",
    "pvporcupine>=4.0.2",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.6",
    "pytubefix>=10.3.6",
    "pytz>=2025.2",
    "requests>=2.32.5",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "speechmatics-tts>=0.1.2",
    "speechrecognition>=3.14.5",
    "sqlalchemy>=2.0.46",
    "supabase>=2.28.0",
    "textblob>=0.19.0",
    "ultralytics>=8.4.14",
    "faster-whisper>=1.1.0",
    # v33: whisper.cpp via pywhispercpp (C++ inference) replaces
    # faster-whisper for the wake-word → STT path.
    "pywhispercpp>=1.4.0",
    "vosk>=0.3.45",
    "slack-bolt>=1.22.0",
    "pydub>=0.25.1",
    "sentence-transformers>=3.4.0",
    "apscheduler>=3.10.4",
    "uvicorn[standard]>=0.34.0",
    "websocket-client>=1.9.0",
    "xai-sdk>=1.6.1",
    "yfinance>=1.2.0",
    "yt-dlp>=2026.2.4",
    "aiomqtt>=2.3.0",
    "alembic>=1.16.0",
    "aiosqlite>=0.21.0",
    "prometheus-client>=0.21.0",
    "psutil>=7.0.0",
    "docker>=7.0.0",
    "feedparser>=6.0.11",
    "jupyter-client>=8.6.0",
    "nbformat>=5.10.0",
    "pyotp>=2.9.0",
    "praw>=7.1.0",
    "python-dateutil>=2.9.0",
    "youtube-transcript-api>=0.6.0",
    "dnspython>=2.6.0",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
voice = [
    "pyaudio>=0.2.14",
]


[project.scripts]
# Entry point for `raven` CLI command.
raven = "app.cli.main:main"
# ``python -m raven`` also works courtesy of app/cli/__main__.py

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "cairosvg>=2.9.0",
]

[tool.pytest.ini_options]
# Restrict collection to the canonical test directory.  The
# 50+ scratch test_*.py files at the repo root are not part of
# the audited suite — they are ad-hoc probes from earlier work.
testpaths = ["tests"]
asyncio_mode = "auto"
# Add the repo root to sys.path so `from scripts.audit_query import ...`
# works in the audit-CLI tests.  ``scripts/`` is a flat directory of
# CLI entrypoints (start_helix.sh, coverage.sh, audit_query.py, etc.)
# that lives at the repo root rather than inside the ``app/`` package.
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
# Use the HelixDB service container in CI.  Override locally with
# RAVEN_HELIX_URL=http://localhost:8080 .venv/bin/pytest ...
filterwarnings = [
    "ignore::DeprecationWarning:opentelemetry.*",
    "ignore::DeprecationWarning:prometheus_client.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:urllib3.*",
    # pytest-asyncio's auto mode interferes with `asyncio.run()`
    # inside KnowledgeManager methods, leaving an unawaited
    # `KnowledgeGraphTool.execute` coroutine in the GC.  The
    # warning is benign (the JSONL fallback path is exercised
    # correctly) but pollutes test output.
    "ignore:coroutine 'KnowledgeGraphTool.execute' was never awaited:RuntimeWarning",
]

[tool.ruff]
# Match the AGENTS.md standard (100-char line limit).
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default rules (E + F): pycodestyle + pyflakes.  We do NOT
# enable isort (I) / bugbear (B) / upgrade (UP) / simplify (SIM)
# because the legacy `app/core/*.py` files have accumulated
# thousands of these violations.  Enable them file-by-file as
# the legacy modules are ratcheted into the new style.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-too-long (handled by line-length + formatter)
]

[tool.ruff.lint.per-file-ignores]
# Legacy files predate the lint policy.  We tolerate the
# accumulated debt here and ratchet it down file-by-file.
"app/core/runtime.py" = [
    "E402",  # module-level imports not at top (legacy)
    "F401",  # unused imports (legacy)
    "F811",  # redefinition (legacy)
    "F821",  # undefined name `time` (legacy pattern)
    "F841",  # unused local (legacy)
]
"app/core/security.py" = [
    "F401",  # `typing.List` unused
]
# Tests can use `assert` and other patterns ruff normally warns about.
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv]
package = true

[tool.setuptools]
packages = ["app", "agent_reach", "raven_protocol"]

